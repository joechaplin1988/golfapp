name: Scrape tee times into Supabase

# Runs the whole pipeline (run_pipeline.py) on a schedule. GitHub Actions is
# both the scheduler and the Python host (n8n Cloud can't run Python).
#
# Scheduled runs don't trust which cron fired. GitHub delays and drops
# scheduled runs for this repository: on 2026-09-13 four of five top-of-the-
# hour slots never ran, and after moving to odd minutes the slots that did
# fire came 35 minutes to 5 hours late (the 00:37 full run started at 05:21).
# So every slot runs --area auto, which reads scrape_runs and does the most
# overdue job:
#   - all of England, 7 days, if no full run has finished in 24 hours (~2.5 h)
#   - else all of England, 3 days, if none has finished in 12 hours   (~70 min)
#   - else London and the Home Counties, 3 days                        (~30 min)
# A dropped or killed run records nothing, so the next slot picks up its work.
#
# The slots keep the old spacing, so clubs are asked no more often than before.
# Only one run holds the concurrency group at a time; a slot that fires while a
# long run is going waits as the single pending run, and by the time it starts
# the history shows the long run done.
#
# Earlier history:
# The gap between them matters. A near run takes ~45 minutes at 516 sheets and
# a full one about two hours, and the concurrency group lets only one run touch
# the database at a time. On the old every-2-hours cadence the full run never
# got a slot: it sat pending until the next near run queued behind it and
# cancelled it, every time, so days 4-7 were never refreshed.
# Platforms scrape in parallel threads inside one job, so a run is roughly
# the slowest platform, not the sum. On a PUBLIC repo Actions minutes are
# unlimited; on a private Free plan the allowance is 2,000 min/month, which
# this cadence exceeds — keep the repo public.

on:
  schedule:
    - cron: "17 4-22/2 * * *"    # every slot is --area auto; see above
    - cron: "47 12 * * *"
    - cron: "37 0 * * *"
  workflow_dispatch:             # manual "Run workflow" button in the Actions tab
    inputs:
      days:
        description: "How many days ahead to scrape (today = 1)"
        default: "7"
        required: false
      area:
        description: "auto = most overdue job; all = every club; launch = London and the Home Counties only"
        type: choice
        options: [auto, all, launch]
        default: auto

concurrency:                     # never let two runs overlap on the same DB
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Measured 2026-09-12: 65 minutes for 3 days over 711 sheets, so a full
    # 7-day pass is around two and a half hours and climbing with every batch
    # of clubs. Budget generously — being killed mid-run loses the far end of
    # the week AND the scrape_runs record, which is how we noticed last time.
    # Actions minutes are free on a public repo.
    # 2026-09-17: raised to GitHub's 6-hour ceiling for hosted runners as the
    # config passed 1,000 sheets; the 7-day pass scales to roughly 3.5 hours.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply pending DB migrations
        env:
          DATABASE_URL: ${{ secrets.GOLF_APP }}
        run: python apply_migrations.py

      - name: Scrape upcoming dates -> Supabase
        env:
          # Repo secret GOLF_APP holds the Supabase connection string in libpq
          # keyword form, via the IPv4 session pooler (the direct host is
          # IPv6-only from GitHub runners):
          #   host=aws-1-eu-west-1.pooler.supabase.com port=5432 user=postgres.<ref> password=<pw> dbname=postgres sslmode=require
          DATABASE_URL: ${{ secrets.GOLF_APP }}
          # Scheduled runs are always auto, which picks its own window. DAYS only
          # matters for a manual run with area all or launch.
          DAYS: ${{ github.event.inputs.days || '3' }}
          AREA: ${{ github.event.inputs.area || 'auto' }}
        run: python run_pipeline.py --days "$DAYS" --area "$AREA"
