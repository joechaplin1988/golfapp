<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tee Times Near You — Kent & Sussex</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --ink: #1c2620; --muted: #5c6b60;
    --line: #e2e6e0; --accent: #1f6b3b; --accent-ink: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12160f; --card:#1b211a; --ink:#e8ece6; --muted:#9fb0a2;
            --line:#2c342a; --accent:#3f9e63; --accent-ink:#0c130d; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 1.55rem; margin: 0 0 4px; letter-spacing: -.02em; }
  header p { margin: 0 0 20px; color: var(--muted); }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
    display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field.wide { grid-column: 1 / -1; }
  label { font-size:.8rem; color:var(--muted); font-weight:600; }
  input, select { font:inherit; padding:10px 12px; border:1px solid var(--line);
    border-radius:9px; background:var(--bg); color:var(--ink); width:100%; }
  button.go { grid-column:1 / -1; margin-top:4px; padding:12px; border:0; border-radius:9px;
    background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1rem; cursor:pointer; }
  button.go:disabled { opacity:.6; cursor:progress; }
  #status { margin:20px 2px 8px; color:var(--muted); min-height:1.2em; }
  .results { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:12px 14px; display:flex; align-items:center; gap:14px; }
  .time { font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; min-width:66px; }
  .meta { flex:1; min-width:0; }
  .club { font-weight:600; }
  .sub { color:var(--muted); font-size:.85rem; }
  .price { text-align:right; font-weight:700; white-space:nowrap; }
  .price .per { display:block; color:var(--muted); font-size:.72rem; font-weight:500; }
  a.book { flex-shrink:0; text-decoration:none; background:var(--accent); color:var(--accent-ink);
    padding:9px 14px; border-radius:8px; font-weight:600; font-size:.9rem; }
  .pill { display:inline-block; font-size:.72rem; color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:1px 7px; margin-left:6px; }
  footer { margin-top:36px; color:var(--muted); font-size:.82rem; text-align:center; }
  @media (max-width:560px){ form{grid-template-columns:1fr;} .row{flex-wrap:wrap;} .price{order:3;} a.book{order:4;margin-left:auto;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⛳ Tee Times Near You</h1>
    <p>Visitor tee times across Kent &amp; Sussex golf clubs, in one place. Book on the club's own site.</p>
  </header>

  <form id="search">
    <div class="field wide">
      <label for="postcode">Your postcode</label>
      <input id="postcode" name="postcode" placeholder="e.g. TN13 1XX" autocomplete="postal-code" required />
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" name="date" type="date" required />
    </div>
    <div class="field">
      <label for="players">Players</label>
      <select id="players">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
    <div class="field">
      <label for="radius">Within</label>
      <select id="radius">
        <option value="5">5 miles</option>
        <option value="10">10 miles</option>
        <option value="15">15 miles</option>
        <option value="20" selected>20 miles</option>
        <option value="30">30 miles</option>
        <option value="50">50 miles</option>
      </select>
    </div>
    <div class="field">
      <label for="holes">Holes</label>
      <select id="holes">
        <option value="">Any</option>
        <option value="18">18</option>
        <option value="9">9</option>
      </select>
    </div>
    <div class="field wide">
      <label for="maxprice">Max total price (£, optional)</label>
      <input id="maxprice" name="maxprice" type="number" min="0" step="1" placeholder="no limit" />
    </div>
    <button class="go" type="submit">Search tee times</button>
  </form>

  <div id="status"></div>
  <div id="results" class="results"></div>

  <footer>
    We don't take bookings or payments — every result links straight to the club's own booking page.
  </footer>
</div>

<script src="config.js"></script>
<script>
// ---- Config -----------------------------------------------------------------
// SUPABASE_ANON_KEY is the *public* key — safe to ship in a browser; Row-Level
// Security on the database allows only read + the search RPC, never writes.
// This is NOT the service_role key, which must never appear in frontend code.
const SUPABASE_URL = "https://uvvrtzkbzoahgppszuvg.supabase.co";
// The anon key is injected at deploy time from Netlify's SUPABASE_ANON_KEY
// environment variable (see netlify.toml, which writes it into config.js).
// Falls back to a placeholder for local dev when config.js isn't present.
const SUPABASE_ANON_KEY = (window.CONFIG && window.CONFIG.SUPABASE_ANON_KEY) || "__PASTE_YOUR_SUPABASE_ANON_KEY_HERE__";

const MILES_PER_KM = 0.621371;
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), resultsEl = $("results");

// Default the date picker to today, and don't allow past dates.
const today = new Date().toISOString().slice(0, 10);
$("date").value = today;
$("date").min = today;

function setStatus(msg) { statusEl.textContent = msg; }
function clearResults() { resultsEl.innerHTML = ""; }

async function geocode(postcode) {
  const r = await fetch("https://api.postcodes.io/postcodes/" + encodeURIComponent(postcode.trim()));
  if (r.status === 404) throw new Error("That postcode wasn't found — check it and try again.");
  if (!r.ok) throw new Error("Couldn't look up that postcode right now.");
  const j = await r.json();
  return { lat: j.result.latitude, lng: j.result.longitude, place: j.result.admin_district };
}

// PostgREST caps any single response at 1,000 rows, so a busy search (a 20mi
// radius on a weekend) silently lost results. Page through with limit/offset
// and read the true total from Content-Range ("0-199/1017").
const PAGE_SIZE = 200;
async function searchTeeTimes(params, offset) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/search_tee_times?limit=" + PAGE_SIZE + "&offset=" + offset, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
      "Prefer": "count=exact",
    },
    body: JSON.stringify(params),
  });
  if (!r.ok) throw new Error("Search failed (" + r.status + "). The database may still be waking up — try again in a moment.");
  const rows = await r.json();
  const range = r.headers.get("Content-Range") || "";
  const total = Number(range.split("/")[1]);
  return { rows, total: Number.isFinite(total) ? total : rows.length };
}

// The current search, so "Show more" can fetch the next page with the same filters.
let current = { params: null, loaded: 0, total: 0 };

async function loadMore(btn) {
  btn.disabled = true;
  btn.textContent = "Loading…";
  try {
    const page = await searchTeeTimes(current.params, current.loaded);
    btn.remove();
    render(page.rows, page.total, true);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Show more";
    setStatus(err.message || "Something went wrong.");
  }
}

function render(rows, total, append) {
  if (!append) { clearResults(); current.loaded = 0; }
  current.total = total;
  current.loaded += rows.length;
  if (!current.loaded) {
    setStatus("No tee times found for that search. Try a wider radius, a different date, or fewer players.");
    return;
  }
  const shown = current.loaded < total ? "Showing " + current.loaded.toLocaleString() + " of " + total.toLocaleString() + " tee times"
                                       : total.toLocaleString() + " tee time" + (total === 1 ? "" : "s") + " found";
  setStatus(shown + " — nearest and cheapest first.");
  for (const t of rows) {
    const miles = (t.distance_km * MILES_PER_KM).toFixed(1);
    const course = t.course_name && t.course_name !== t.club_name ? " · " + t.course_name : "";
    const price = t.price != null ? "£" + Number(t.price).toFixed(0) : "—";
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<div class="time">' + String(t.tee_time).slice(0,5) + '</div>' +
      '<div class="meta">' +
        '<div class="club">' + esc(t.club_name) + esc(course) +
          '<span class="pill">' + t.holes + ' holes</span></div>' +
        '<div class="sub">' + miles + ' mi away</div>' +
      '</div>' +
      '<div class="price">' + price + '<span class="per">' + playersLabel() + '</span></div>' +
      '<a class="book" href="' + esc(t.booking_url) + '" target="_blank" rel="noopener noreferrer">Book</a>';
    resultsEl.appendChild(row);
  }
  if (current.loaded < total) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "go more";
    more.textContent = "Show more";
    more.addEventListener("click", () => loadMore(more));
    resultsEl.appendChild(more);
  }
}

function playersLabel() {
  const n = $("players").value;
  return n + " player" + (n === "1" ? "" : "s");
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

$("search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button.go");
  btn.disabled = true;
  clearResults();
  try {
    if (SUPABASE_ANON_KEY.startsWith("__PASTE")) {
      setStatus("Not configured yet: the Supabase anon key hasn't been set in index.html.");
      return;
    }
    setStatus("Finding your location…");
    const loc = await geocode($("postcode").value);
    setStatus("Searching clubs near " + (loc.place || "you") + "…");
    const maxprice = $("maxprice").value ? Number($("maxprice").value) : null;
    const holes = $("holes").value ? Number($("holes").value) : null;
    current.params = {
      in_lat: loc.lat, in_lng: loc.lng,
      in_radius_km: Number($("radius").value) / MILES_PER_KM,
      in_date: $("date").value,
      in_players: Number($("players").value),
      in_max_price: maxprice,
      in_holes: holes,
    };
    const page = await searchTeeTimes(current.params, 0);
    render(page.rows, page.total, false);
  } catch (err) {
    setStatus(err.message || "Something went wrong.");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
