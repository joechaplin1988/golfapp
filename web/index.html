<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tee Times Near You — Kent & Sussex</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --ink: #1c2620; --muted: #5c6b60;
    --line: #e2e6e0; --accent: #1f6b3b; --accent-ink: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12160f; --card:#1b211a; --ink:#e8ece6; --muted:#9fb0a2;
            --line:#2c342a; --accent:#3f9e63; --accent-ink:#0c130d; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 1.55rem; margin: 0 0 4px; letter-spacing: -.02em; }
  header p { margin: 0 0 20px; color: var(--muted); }
  form, .filters { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
    display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .filters { grid-template-columns: repeat(4, 1fr); margin-top:16px; }
  .filters[hidden] { display:none; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field.wide { grid-column: 1 / -1; }
  .field.between { grid-column: span 2; }
  .between .pair { display:flex; align-items:center; gap:8px; }
  .between .pair span { color:var(--muted); font-size:.85rem; }
  label { font-size:.8rem; color:var(--muted); font-weight:600; }
  input, select { font:inherit; padding:10px 12px; border:1px solid var(--line);
    border-radius:9px; background:var(--bg); color:var(--ink); width:100%; }
  button.go { grid-column:1 / -1; margin-top:4px; padding:12px; border:0; border-radius:9px;
    background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1rem; cursor:pointer; }
  button.go:disabled { opacity:.6; cursor:progress; }
  #status { margin:20px 2px 8px; color:var(--muted); min-height:1.2em; }
  .results { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  details.club { background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); }
  details.club > summary { list-style:none; cursor:pointer; padding:12px 14px;
    display:flex; align-items:center; gap:14px; }
  details.club > summary::-webkit-details-marker { display:none; }
  .meta { flex:1; min-width:0; }
  .club-name { font-weight:600; }
  .sub { color:var(--muted); font-size:.85rem; }
  .from { text-align:right; white-space:nowrap; }
  .from b { font-size:1.15rem; }
  .from span { display:block; color:var(--muted); font-size:.72rem; }
  .chev { color:var(--muted); font-size:.9rem; transition:transform .15s; }
  details[open] > summary .chev { transform:rotate(180deg); }
  .times { border-top:1px solid var(--line); padding:6px 14px 10px; display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; gap:14px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:0; }
  .time { font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; min-width:60px; }
  .price { text-align:right; font-weight:700; white-space:nowrap; margin-left:auto; }
  .price .per { display:block; color:var(--muted); font-size:.72rem; font-weight:500; }
  a.book { flex-shrink:0; text-decoration:none; background:var(--accent); color:var(--accent-ink);
    padding:8px 13px; border-radius:8px; font-weight:600; font-size:.88rem; }
  .pill { display:inline-block; font-size:.72rem; color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:1px 7px; margin-left:6px; }
  footer { margin-top:36px; color:var(--muted); font-size:.82rem; text-align:center; }
  @media (max-width:560px){
    form{grid-template-columns:1fr;} .filters{grid-template-columns:1fr 1fr;} .field.between{grid-column:1 / -1;}
    details.club > summary{flex-wrap:wrap;} .from{order:3;} .row{flex-wrap:wrap;} a.book{margin-left:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⛳ Tee Times Near You</h1>
    <p>Visitor tee times across Kent &amp; Sussex golf clubs, in one place. Book on the club's own site.</p>
  </header>

  <form id="search">
    <div class="field wide">
      <label for="postcode">Your postcode</label>
      <input id="postcode" name="postcode" placeholder="e.g. TN13 1XX" autocomplete="postal-code" required />
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" name="date" type="date" required />
    </div>
    <div class="field">
      <label for="players">Players</label>
      <select id="players">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
    <div class="field wide">
      <label for="radius">Within</label>
      <select id="radius">
        <option value="5">5 miles</option>
        <option value="10">10 miles</option>
        <option value="15">15 miles</option>
        <option value="20" selected>20 miles</option>
        <option value="30">30 miles</option>
        <option value="50">50 miles</option>
      </select>
    </div>
    <button class="go" type="submit">Search tee times</button>
  </form>

  <!-- Filters work on the results already loaded, so changing one is instant. -->
  <div class="filters" id="filters" hidden>
    <div class="field between">
      <label for="from">Play between</label>
      <div class="pair">
        <select id="from"></select><span>and</span><select id="to"></select>
      </div>
    </div>
    <div class="field">
      <label for="holes">Holes</label>
      <select id="holes">
        <option value="">Any</option>
        <option value="18">18</option>
        <option value="9">9</option>
      </select>
    </div>
    <div class="field">
      <label for="maxprice">Max total £</label>
      <input id="maxprice" type="number" min="0" step="1" placeholder="no limit" />
    </div>
    <div class="field wide">
      <label for="sort">Sort clubs by</label>
      <select id="sort">
        <option value="distance">Nearest first</option>
        <option value="price">Cheapest first</option>
        <option value="time">Earliest tee time first</option>
      </select>
    </div>
  </div>

  <div id="status"></div>
  <div id="results" class="results"></div>

  <footer>
    We don't take bookings or payments — every result links straight to the club's own booking page.
  </footer>
</div>

<script src="config.js"></script>
<script>
// ---- Config -----------------------------------------------------------------
// SUPABASE_ANON_KEY is the *public* key — safe to ship in a browser; Row-Level
// Security on the database allows only read + the search RPC, never writes.
// This is NOT the service_role key, which must never appear in frontend code.
const SUPABASE_URL = "https://uvvrtzkbzoahgppszuvg.supabase.co";
// The anon key is injected at deploy time from Netlify's SUPABASE_ANON_KEY
// environment variable (see netlify.toml, which writes it into config.js).
// Falls back to a placeholder for local dev when config.js isn't present.
const SUPABASE_ANON_KEY = (window.CONFIG && window.CONFIG.SUPABASE_ANON_KEY) || "__PASTE_YOUR_SUPABASE_ANON_KEY_HERE__";

const MILES_PER_KM = 0.621371;
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), resultsEl = $("results"), filtersEl = $("filters");

// Default the date picker to today, and don't allow past dates.
const today = new Date().toISOString().slice(0, 10);
$("date").value = today;
$("date").min = today;

// "Play between" options: 05:00 .. 21:00 in half-hour steps.
(function buildTimeOptions() {
  const opts = [];
  for (let h = 5; h <= 21; h++) for (const m of ["00", "30"]) {
    if (h === 21 && m === "30") break;
    opts.push(String(h).padStart(2, "0") + ":" + m);
  }
  for (const id of ["from", "to"]) {
    $(id).innerHTML = opts.map(t => '<option value="' + t + '">' + t + '</option>').join("");
  }
  $("from").value = "06:00";
  $("to").value = "20:00";
})();

function setStatus(msg) { statusEl.textContent = msg; }

async function geocode(postcode) {
  const r = await fetch("https://api.postcodes.io/postcodes/" + encodeURIComponent(postcode.trim()));
  if (r.status === 404) throw new Error("That postcode wasn't found — check it and try again.");
  if (!r.ok) throw new Error("Couldn't look up that postcode right now.");
  const j = await r.json();
  return { lat: j.result.latitude, lng: j.result.longitude, place: j.result.admin_district };
}

// PostgREST caps any single response at 1,000 rows, so page through with
// limit/offset (a Range header does NOT limit RPC calls) and read the true
// total from Content-Range ("0-999/2317"). Everything is loaded up front so
// the filters below never need another round trip.
const PAGE_SIZE = 1000;
async function fetchAllTeeTimes(params) {
  const rows = [];
  let total = null;
  do {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/search_tee_times?limit=" + PAGE_SIZE + "&offset=" + rows.length, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "count=exact",
      },
      body: JSON.stringify(params),
    });
    if (!r.ok) throw new Error("Search failed (" + r.status + "). The database may still be waking up — try again in a moment.");
    const page = await r.json();
    const range = r.headers.get("Content-Range") || "";
    const t = Number(range.split("/")[1]);
    total = Number.isFinite(t) ? t : page.length;
    rows.push(...page);
    if (!page.length) break;
    if (rows.length < total) setStatus("Loading " + rows.length.toLocaleString() + " of " + total.toLocaleString() + " tee times…");
  } while (rows.length < total);
  return rows;
}

// ---- Results state + filtering ---------------------------------------------
let allRows = [];   // every tee time the last search returned (one per course + time)

function currentFilters() {
  return {
    from: $("from").value,
    to: $("to").value,
    holes: $("holes").value,
    maxPrice: $("maxprice").value ? Number($("maxprice").value) : null,
    sort: $("sort").value,
  };
}

function applyFilters(rows, f) {
  return rows.filter(t => {
    const hhmm = String(t.tee_time).slice(0, 5);
    if (hhmm < f.from || hhmm > f.to) return false;
    if (f.holes && String(t.holes) !== f.holes) return false;
    // A max price means "I know what I'll pay", so unpriced slots drop out too.
    if (f.maxPrice != null && (t.price == null || Number(t.price) > f.maxPrice)) return false;
    return true;
  });
}

// One card per course: the club's tee times collapsed behind a summary line.
function groupByCourse(rows) {
  const groups = new Map();
  for (const t of rows) {
    const key = t.club_name + "|" + (t.course_name || "");
    let g = groups.get(key);
    if (!g) {
      g = { club: t.club_name, course: t.course_name, distance_km: t.distance_km, times: [] };
      groups.set(key, g);
    }
    g.times.push(t);
  }
  for (const g of groups.values()) {
    g.times.sort((a, b) => String(a.tee_time).localeCompare(String(b.tee_time)));
    const priced = g.times.map(t => t.price).filter(p => p != null).map(Number);
    g.minPrice = priced.length ? Math.min(...priced) : null;
    g.earliest = String(g.times[0].tee_time).slice(0, 5);
  }
  return [...groups.values()];
}

function sortGroups(groups, sort) {
  const byDistance = (a, b) => a.distance_km - b.distance_km;
  if (sort === "price") {
    groups.sort((a, b) => ((a.minPrice ?? Infinity) - (b.minPrice ?? Infinity)) || byDistance(a, b));
  } else if (sort === "time") {
    groups.sort((a, b) => a.earliest.localeCompare(b.earliest) || byDistance(a, b));
  } else {
    groups.sort(byDistance);
  }
  return groups;
}

function render() {
  resultsEl.innerHTML = "";
  const f = currentFilters();
  const rows = applyFilters(allRows, f);
  if (!allRows.length) {
    setStatus("No tee times found for that search. Try a wider radius, a different date, or fewer players.");
    return;
  }
  if (!rows.length) {
    setStatus("Nothing between " + f.from + " and " + f.to + " with those filters — " +
              allRows.length.toLocaleString() + " tee times are available on this date if you widen them.");
    return;
  }
  const groups = sortGroups(groupByCourse(rows), f.sort);
  setStatus(rows.length.toLocaleString() + " tee time" + (rows.length === 1 ? "" : "s") + " at " +
            groups.length + " course" + (groups.length === 1 ? "" : "s") +
            " between " + f.from + " and " + f.to + ". Tap a club to see its times.");

  for (const g of groups) {
    const miles = (g.distance_km * MILES_PER_KM).toFixed(1);
    const course = g.course && g.course !== g.club ? " · " + g.course : "";
    const n = g.times.length;
    const holesSet = [...new Set(g.times.map(t => t.holes))].sort((a, b) => b - a);
    const card = document.createElement("details");
    card.className = "club";
    card.innerHTML =
      '<summary>' +
        '<div class="meta">' +
          '<div class="club-name">' + esc(g.club) + esc(course) +
            holesSet.map(h => '<span class="pill">' + h + ' holes</span>').join("") + '</div>' +
          '<div class="sub">' + miles + ' mi away · ' + n + ' tee time' + (n === 1 ? "" : "s") +
            ' from ' + g.earliest + '</div>' +
        '</div>' +
        '<div class="from">' + (g.minPrice != null
            ? '<b>from £' + g.minPrice.toFixed(0) + '</b><span>' + playersLabel() + '</span>'
            : '<span>price on club site</span>') + '</div>' +
        '<div class="chev">▾</div>' +
      '</summary>' +
      '<div class="times"></div>';
    const list = card.querySelector(".times");
    for (const t of g.times) {
      // Some council courses (Gladstone) publish availability but no price.
      const price = t.price != null ? "£" + Number(t.price).toFixed(0) : "see site";
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="time">' + String(t.tee_time).slice(0, 5) + '</div>' +
        '<span class="pill">' + t.holes + ' holes</span>' +
        '<div class="price">' + price + '<span class="per">' + playersLabel() + '</span></div>' +
        '<a class="book" href="' + esc(t.booking_url) + '" target="_blank" rel="noopener noreferrer">Book</a>';
      list.appendChild(row);
    }
    resultsEl.appendChild(card);
  }
}

function playersLabel() {
  const n = $("players").value;
  return n + " player" + (n === "1" ? "" : "s");
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

for (const id of ["from", "to", "holes", "maxprice", "sort"]) {
  $(id).addEventListener("input", render);
}

$("search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button.go");
  btn.disabled = true;
  resultsEl.innerHTML = "";
  try {
    if (SUPABASE_ANON_KEY.startsWith("__PASTE")) {
      setStatus("Not configured yet: the Supabase anon key hasn't been set in index.html.");
      return;
    }
    setStatus("Finding your location…");
    const loc = await geocode($("postcode").value);
    setStatus("Searching clubs near " + (loc.place || "you") + "…");
    allRows = await fetchAllTeeTimes({
      in_lat: loc.lat, in_lng: loc.lng,
      in_radius_km: Number($("radius").value) / MILES_PER_KM,
      in_date: $("date").value,
      in_players: Number($("players").value),
      in_max_price: null,   // price, holes and time window are filtered client-side
      in_holes: null,
    });
    filtersEl.hidden = false;
    render();
  } catch (err) {
    setStatus(err.message || "Something went wrong.");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
